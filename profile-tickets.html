<main>

    <h1 class="reveal-up" style="font-family:var(--font-display); font-size:clamp(28px,5vw,38px);">Support</h1>
  </div>

  <div id="tickets-root" class="account-detail">
    <section class="account-section glass-panel reveal-up">
      <h2 class="account-section-title">Your tickets</h2>
      <div id="ticket-list"></div>
      <form id="ticket-form" novalidate>
        <p id="ticket-error" class="auth-error" role="alert"></p>
        <p id="ticket-success" class="auth-error" role="status" style="background:rgba(232,134,44,0.12); border-color:var(--accent-dim); color:var(--amber-text);"></p>
        <div class="auth-field">
          <label for="ticket-subject">Subject</label>
          <input type="text" id="ticket-subject" name="subject" required>
        </div>
        <div class="auth-field">
          <label for="ticket-message">Message</label>
          <textarea id="ticket-message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Open ticket</button>
      </form>
    </section>
  </div>
</main>
